# Field Shift theme — warm earth tones with green accents in light and dark
# modes.

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["36px", "30px", "24px", "20px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true

[theme.light]
primaryColor = "#8d4925"
backgroundColor = "#fff8f4"
secondaryBackgroundColor = "#f9e8de"
codeBackgroundColor = "#f4ddd0"
textColor = "#352319"
linkColor = "#8d4925"
borderColor = "#e7c8b5"
codeTextColor = "#352319"
grayColor = "#725c50"
blueColor = "#c57d56"
greenColor = "#087f39"
redColor = "#8d4925"
yellowColor = "#ffb48a"
orangeColor = "#c57d56"
violetColor = "#8d4925"
chartCategoricalColors = ["#087f39", "#a65c39", "#8d4925", "#c57d56", "#ffb48a"]
dataframeBorderColor = "#e7c8b5"
dataframeHeaderBackgroundColor = "#f9e8de"

[theme.dark]
primaryColor = "#8d4925"
backgroundColor = "#17110e"
secondaryBackgroundColor = "#241913"
codeBackgroundColor = "#302119"
textColor = "#f8ede6"
linkColor = "#ffb48a"
borderColor = "#493021"
codeTextColor = "#f8ede6"
grayColor = "#b49a89"
blueColor = "#c57d56"
greenColor = "#20ef71"
redColor = "#c57d56"
yellowColor = "#ffb48a"
orangeColor = "#c57d56"
violetColor = "#8d4925"
chartCategoricalColors = ["#20ef71", "#ffb48a", "#c57d56", "#0cd359", "#d99a76"]
dataframeBorderColor = "#493021"
dataframeHeaderBackgroundColor = "#241913"

[theme.light.sidebar]
backgroundColor = "#fff0e8"
secondaryBackgroundColor = "#f9e8de"
codeBackgroundColor = "#f4ddd0"
textColor = "#352319"
borderColor = "#e7c8b5"
primaryColor = "#8d4925"
linkColor = "#8d4925"
dataframeHeaderBackgroundColor = "#f9e8de"
dataframeBorderColor = "#e7c8b5"

[theme.dark.sidebar]
backgroundColor = "#130e0b"
secondaryBackgroundColor = "#241913"
codeBackgroundColor = "#302119"
textColor = "#f8ede6"
borderColor = "#493021"
primaryColor = "#8d4925"
linkColor = "#ffb48a"
dataframeHeaderBackgroundColor = "#241913"
dataframeBorderColor = "#493021"
