# Field Shift theme — based on Streamlit's shadcn-dual template with an
# near-white sage and deep forest palette (light/dark toggle stays available).

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["36px", "30px", "24px", "20px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true

# Near-white sage surfaces with forest-green text.
[theme.light]
primaryColor = "#2E6B46"
backgroundColor = "#F3F8F0"
secondaryBackgroundColor = "#E7F0E2"
codeBackgroundColor = "#DFEBDA"
textColor = "#193D2A"
linkColor = "#28603D"
borderColor = "#C5D8BF"
codeTextColor = "#193D2A"
grayColor = "#576F5B"
blueColor = "#357477"
greenColor = "#2E6B46"
redColor = "#A3443D"
yellowColor = "#8A691D"
orangeColor = "#A05B2C"
violetColor = "#756087"
chartCategoricalColors = ["#2E6B46", "#357477", "#A05B2C", "#756087", "#8A691D", "#60804A"]
dataframeBorderColor = "#C5D8BF"
dataframeHeaderBackgroundColor = "#DFEBDA"
dataframeHeaderTextColor = "#193D2A"

# Forest at night: deep teal surfaces, luminous mint accents and warm highlights.
[theme.dark]
primaryColor = "#63DDB0"
backgroundColor = "#0D1917"
secondaryBackgroundColor = "#1A302A"
codeBackgroundColor = "#213D34"
textColor = "#E6F2EB"
linkColor = "#8AE8C4"
borderColor = "#3B5E4F"
codeTextColor = "#B6E8CC"
baseRadius = "12px"
buttonRadius = "10px"
grayColor = "#A4BFB1"
blueColor = "#7FCDE1"
greenColor = "#63DDB0"
redColor = "#F19A91"
yellowColor = "#E9CD85"
orangeColor = "#EFB284"
violetColor = "#BEAFE8"
chartCategoricalColors = ["#63DDB0", "#7FCDE1", "#E9CD85", "#BEAFE8", "#EFB284", "#A8D480"]
dataframeBorderColor = "#3B5E4F"
dataframeHeaderBackgroundColor = "#254438"
dataframeHeaderTextColor = "#E6F2EB"

[theme.light.sidebar]
backgroundColor = "#EAF2E5"
secondaryBackgroundColor = "#DFEBDA"
codeBackgroundColor = "#D5E4CF"
textColor = "#193D2A"
codeTextColor = "#193D2A"
borderColor = "#C5D8BF"
primaryColor = "#2E6B46"
linkColor = "#28603D"
dataframeHeaderBackgroundColor = "#D5E4CF"
dataframeHeaderTextColor = "#193D2A"
dataframeBorderColor = "#C5D8BF"

[theme.dark.sidebar]
backgroundColor = "#12231E"
secondaryBackgroundColor = "#213D32"
codeBackgroundColor = "#294A3D"
textColor = "#E6F2EB"
codeTextColor = "#B6E8CC"
borderColor = "#3B5E4F"
primaryColor = "#63DDB0"
linkColor = "#8AE8C4"
dataframeHeaderBackgroundColor = "#294A3D"
dataframeHeaderTextColor = "#E6F2EB"
dataframeBorderColor = "#3B5E4F"
