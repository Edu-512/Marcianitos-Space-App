<div class="assistant-root">
  <button class="surco-fab" type="button" aria-label="Open chat with Don Surco" aria-expanded="false" aria-controls="surco-panel">
    <img class="fab-avatar" alt="" />
    <span class="fab-badge" aria-hidden="true">✦</span>
    <span class="fab-name">Don Surco</span>
  </button>
  <div class="surco-scrim" hidden></div>
  <section id="surco-panel" class="surco-panel" role="dialog" aria-modal="true" aria-labelledby="surco-title" inert>
    <header class="chat-header">
      <img class="header-avatar" alt="" />
      <div class="header-copy"><span class="eyebrow">YOUR FARMING COMPANION</span><h2 id="surco-title">Don Surco <span aria-hidden="true">✦</span></h2><p class="chat-context"></p></div>
      <button class="close icon-button" type="button" aria-label="Close chat">×</button>
    </header>
    <div class="chat-toolbar"><span>AI assistant · demo data</span><button class="clear" type="button">New chat</button></div>
    <div class="clear-confirm" hidden><span>Clear this conversation?</span><button class="confirm" type="button">Clear</button><button class="keep" type="button">Keep</button></div>
    <div class="chat-body" tabindex="0" aria-label="Conversation">
      <div class="welcome"><span class="welcome-kicker">FROM THE FIELD TO A SOLUTION</span><h3>How is your field doing?</h3><p>I'm Don Surco. Let's understand your field and find a good next step.</p>
        <div class="suggestions">
          <button type="button" data-prompt="How is my plot doing, and what are its main risks?">🌱 How is my plot doing?</button>
          <button type="button" data-prompt="Which crop rotation best fits my priorities?">↻ Explore a crop rotation</button>
          <button type="button" data-prompt="What can I do to save water on my plot?">💧 I want to save water</button>
        </div>
      </div>
      <div class="messages" role="log" aria-label="Conversation messages"></div>
    </div>
    <div class="chat-status" role="status" aria-live="polite"></div>
    <form class="chat-form"><label for="surco-input" class="sr-only">Your question for Don Surco</label><textarea id="surco-input" rows="2" maxlength="2000" placeholder="Tell me, what's happening in your field?"></textarea><button class="send" type="submit" aria-label="Send message">↑</button></form>
    <footer>Verify recommendations in the field. This conversation lasts for this session.</footer>
  </section>
</div>
